<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 72" fill="none">
  <defs>
    <linearGradient id="logoGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#B89152"/>
      <stop offset="100%" stop-color="#936F2B"/>
    </linearGradient>
    <linearGradient id="accentGold" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#B89152" stop-opacity="0.1"/>
      <stop offset="50%" stop-color="#B89152" stop-opacity="1"/>
      <stop offset="100%" stop-color="#B89152" stop-opacity="0.1"/>
    </linearGradient>
  </defs>

  <!-- Left Lotus Emblem Mark (X: 0 to 64, Y: 4 to 68) -->
  <g transform="translate(6, 4) scale(0.64)">
    <!-- Top Center Petal -->
    <path d="M 50 16 C 42 28 42 42 50 50 C 58 42 58 28 50 16 Z" 
          fill="#FAF9F6" stroke="url(#logoGold)" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Upper Left Petal -->
    <path d="M 46 22 C 34 26 26 38 34 50 C 40 46 46 38 46 22 Z" 
          fill="#FAF9F6" stroke="url(#logoGold)" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Upper Right Petal -->
    <path d="M 54 22 C 66 26 74 38 66 50 C 60 46 54 38 54 22 Z" 
          fill="#FAF9F6" stroke="url(#logoGold)" stroke-width="2.2" stroke-linejoin="round"/>
    <!-- Mid Left Petal -->
    <path d="M 32 36 C 20 44 18 56 30 64 C 36 56 36 46 32 36 Z" 
          fill="#FAF9F6" stroke="url(#logoGold)" stroke-width="2" stroke-linejoin="round"/>
    <!-- Mid Right Petal -->
    <path d="M 68 36 C 80 44 82 56 70 64 C 64 56 64 46 68 36 Z" 
          fill="#FAF9F6" stroke="url(#logoGold)" stroke-width="2" stroke-linejoin="round"/>
    <!-- Outer Low Left Petal -->
    <path d="M 28 54 C 16 60 16 70 28 72 C 36 70 38 62 28 54 Z" 
          fill="#FAF9F6" stroke="url(#logoGold)" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Outer Low Right Petal -->
    <path d="M 72 54 C 84 60 84 70 72 72 C 64 70 62 62 72 54 Z" 
          fill="#FAF9F6" stroke="url(#logoGold)" stroke-width="1.8" stroke-linejoin="round"/>
    <!-- Bottom Arch Calyx (Base) -->
    <path d="M 26 72 C 40 82 60 82 74 72 C 60 76 40 76 26 72 Z" 
          fill="url(#logoGold)" stroke="url(#logoGold)" stroke-width="1"/>
    <!-- Center Stylized Tooth Petal -->
    <path d="M 50 36 C 45 31 38 32 37 39 C 36 46 38 54 44 68 C 46 72 48 72 49 66 C 49.5 63 50.5 63 51 66 C 52 72 54 72 56 68 C 62 54 64 46 63 39 C 62 32 55 31 50 36 Z" 
          fill="#FFFFFF" stroke="url(#logoGold)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inner Tooth Arch -->
    <path d="M 46 54 C 47.5 50 52.5 50 54 54 C 55 57 53 62 50 63 C 47 62 45 57 46 54 Z" 
          fill="none" stroke="url(#logoGold)" stroke-width="1.6" stroke-linecap="round"/>
  </g>

  <!-- Typography Right Side -->
  <!-- NUFĂRUL (Serif, refined, charcoal #202426) -->
  <text x="82" y="32" 
        font-family="'Cormorant Garamond', 'Cinzel', 'Playfair Display', 'Times New Roman', serif" 
        font-size="27" 
        font-weight="700" 
        letter-spacing="3.5" 
        fill="#202426">NUFĂRUL</text>

  <!-- SMILE (Gold, spaced) -->
  <text x="83" y="49" 
        font-family="'Manrope', 'Montserrat', 'Inter', sans-serif" 
        font-size="11.5" 
        font-weight="600" 
        letter-spacing="8" 
        fill="#B89152">S M I L E</text>

  <!-- Divider Line -->
  <line x1="82" y1="54" x2="280" y2="54" stroke="url(#accentGold)" stroke-width="1"/>

  <!-- Subtitle: CLINICĂ STOMATOLOGICĂ -->
  <text x="83" y="65" 
        font-family="'Manrope', 'Inter', sans-serif" 
        font-size="8" 
        font-weight="500" 
        letter-spacing="3" 
        fill="#7A8084">CLINICĂ STOMATOLOGICĂ</text>
</svg>
