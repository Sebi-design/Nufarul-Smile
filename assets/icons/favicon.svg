<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#D4AF37"/>
      <stop offset="50%" stop-color="#B89152"/>
      <stop offset="100%" stop-color="#8F6B2B"/>
    </linearGradient>
    <radialGradient id="softWhite" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="85%" stop-color="#FBF9F5"/>
      <stop offset="100%" stop-color="#EFEBE4"/>
    </radialGradient>
    <filter id="subtleGlow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="2" flood-color="#B89152" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle (Optional, subtle luxury ivory) -->
  <circle cx="50" cy="50" r="48" fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="1.5"/>

  <!-- Lotus Petals Backdrop -->
  <!-- Top Center Petal -->
  <path d="M 50 16 C 42 28 42 42 50 50 C 58 42 58 28 50 16 Z" 
        fill="url(#softWhite)" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Upper Left Petal -->
  <path d="M 46 22 C 34 26 26 38 34 50 C 40 46 46 38 46 22 Z" 
        fill="url(#softWhite)" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Upper Right Petal -->
  <path d="M 54 22 C 66 26 74 38 66 50 C 60 46 54 38 54 22 Z" 
        fill="url(#softWhite)" stroke="url(#goldGrad)" stroke-width="1.5" stroke-linejoin="round"/>

  <!-- Mid Left Petal -->
  <path d="M 32 36 C 20 44 18 56 30 64 C 36 56 36 46 32 36 Z" 
        fill="url(#softWhite)" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Mid Right Petal -->
  <path d="M 68 36 C 80 44 82 56 70 64 C 64 56 64 46 68 36 Z" 
        fill="url(#softWhite)" stroke="url(#goldGrad)" stroke-width="1.4" stroke-linejoin="round"/>

  <!-- Outer Low Left Petal -->
  <path d="M 28 54 C 16 60 16 70 28 72 C 36 70 38 62 28 54 Z" 
        fill="url(#softWhite)" stroke="url(#goldGrad)" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Outer Low Right Petal -->
  <path d="M 72 54 C 84 60 84 70 72 72 C 64 70 62 62 72 54 Z" 
        fill="url(#softWhite)" stroke="url(#goldGrad)" stroke-width="1.3" stroke-linejoin="round"/>

  <!-- Bottom Arch Calyx (Base) -->
  <path d="M 26 72 C 40 82 60 82 74 72 C 60 76 40 76 26 72 Z" 
        fill="url(#goldGrad)" stroke="url(#goldGrad)" stroke-width="1"/>

  <!-- Center Stylized Tooth Petal -->
  <path d="M 50 36 C 45 31 38 32 37 39 C 36 46 38 54 44 68 C 46 72 48 72 49 66 C 49.5 63 50.5 63 51 66 C 52 72 54 72 56 68 C 62 54 64 46 63 39 C 62 32 55 31 50 36 Z" 
        fill="#FFFFFF" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" filter="url(#subtleGlow)"/>

  <!-- Inner Tooth Heart Arch -->
  <path d="M 46 54 C 47.5 50 52.5 50 54 54 C 55 57 53 62 50 63 C 47 62 45 57 46 54 Z" 
        fill="none" stroke="url(#goldGrad)" stroke-width="1.2" stroke-linecap="round"/>
</svg>
